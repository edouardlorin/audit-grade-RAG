services:
  qdrant:
    image: qdrant/qdrant:v1.15.1     # pin; verify the current stable tag
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"        # loopback only - never 0.0.0.0
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"   # from qdrant/.env, git-ignored
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__STORAGE__SNAPSHOTS_PATH: "/qdrant/snapshots"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "4"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  qdrant-storage:
    external: true                   # create first: docker volume create qdrant-storage